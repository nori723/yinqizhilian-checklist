<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#b4232a">
<title>银企直联材料清单</title>
<style>
:root{
  --red:#b4232a; --red-d:#8f1d22; --red-bg:#fdf1f1;
  --bg:#f4f5f7; --card:#ffffff; --ink:#23272d; --muted:#8a919c; --line:#eceef1;
  --amber:#9a5b00; --amber-bg:#fff7e6; --amber-line:#f5dfa8;
  --blue:#1d4ed8; --blue-bg:#eef4ff;
  --green:#047857; --green-bg:#eafaf1;
  --purple:#6d28d9; --purple-bg:#f3eefe;
  --shadow:0 1px 3px rgba(20,30,40,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  word-break:break-all;
}
body.bigfont #main{zoom:1.14}
#topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(135deg,var(--red) 0%,var(--red-d) 100%);
  color:#fff; padding:10px 10px 10px 14px;
  display:flex; align-items:center; gap:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
#backbtn{
  display:none; border:none; background:rgba(255,255,255,.18); color:#fff;
  width:30px; height:30px; border-radius:15px; font-size:17px; line-height:1; flex:none;
}
#backbtn.show{display:block}
#pagetitle{font-size:17px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tbtn{
  flex:none; border:none; background:rgba(255,255,255,.18); color:#fff;
  height:30px; min-width:30px; padding:0 9px; border-radius:15px; font-size:12.5px; font-weight:600;
}
.tbtn.alt{background:rgba(255,255,255,.10)}
#searchwrap{position:sticky; top:0; z-index:49; background:var(--bg); padding:10px 14px 4px}
#searchbox{
  display:flex; align-items:center; gap:6px; background:var(--card);
  border:1px solid var(--line); border-radius:10px; padding:8px 12px; box-shadow:var(--shadow);
}
#searchbox input{border:none; outline:none; flex:1; font-size:15px; background:transparent; color:var(--ink)}
#searchbox .icon{color:var(--muted); font-size:14px}
#searchdrop{
  margin:6px 0 2px; background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 6px 18px rgba(20,30,40,.14); overflow:hidden; display:none;
}
#searchdrop.show{display:block}
#searchdrop .sgroup{padding:6px 12px 2px; font-size:12px; color:var(--muted)}
#searchdrop .sitem{padding:9px 12px; border-top:1px solid var(--line); font-size:14px; cursor:pointer}
#searchdrop .sitem:active{background:var(--red-bg)}
#searchdrop .sitem small{color:var(--muted); display:block; font-size:12px}
#searchdrop .sempty{padding:14px; text-align:center; color:var(--muted); font-size:13px}
#qwords{display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px}
#qwords button{
  border:1px solid var(--line); background:#f7f8fa; color:#4a525c; font-size:12.5px;
  border-radius:14px; padding:4px 12px;
}
#main{padding:12px 14px 90px; max-width:760px; margin:0 auto}
#bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
#bottomnav button{
  flex:1; border:none; background:none; padding:7px 0 6px; font-size:11px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:1px;
}
#bottomnav button .ni{font-size:19px; line-height:1.2}
#bottomnav button.on{color:var(--red); font-weight:600}
.card{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:14px 15px; margin-bottom:12px}
.card h2{margin:0 0 8px; font-size:16.5px; display:flex; align-items:center; gap:7px}
.card h2 .bar{width:4px; height:16px; border-radius:2px; background:var(--red); flex:none}
.chip{
  display:inline-block; font-size:11.5px; padding:1.5px 8px; border-radius:9px; margin:2px 4px 2px 0;
  background:var(--red-bg); color:var(--red); white-space:nowrap;
}
.chip.gray{background:#f0f2f5; color:var(--muted)}
.chip.blue{background:var(--blue-bg); color:var(--blue)}
.chip.purple{background:var(--purple-bg); color:var(--purple)}
.chip.green{background:var(--green-bg); color:var(--green)}
.chip.amber{background:var(--amber-bg); color:var(--amber)}
.chip.warn{background:#fdecea; color:var(--red-d); border:1px solid #f2c7c9; font-weight:600}
.chip.link{cursor:pointer}
.hint-tag{
  display:inline-block; font-size:11px; padding:1px 7px; border-radius:4px; margin-right:6px;
  background:#58470f; color:#ffe9a8; vertical-align:1px;
}
.callout{border-radius:10px; padding:10px 12px; font-size:14px; margin:8px 0}
.callout .ct{font-weight:600; margin-bottom:3px; font-size:13.5px}
.callout.premise{background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber-line)}
.callout.mutex{background:var(--red-bg); color:var(--red-d); border:1px solid #f2c7c9}
.callout.timing{background:var(--blue-bg); color:var(--blue); border:1px solid #c9d9f7}
.callout.script{background:var(--green-bg); color:var(--green); border:1px solid #bfe8d2}
.callout.general{background:#f0f2f5; color:#4a525c; border:1px solid var(--line)}
.callout.hint{background:#fffbe9; color:#6b5310; border:1px dashed #e3c96b}
.callout .src{display:block; font-size:11px; opacity:.65; margin-top:3px}
body.clientview .internal{display:none !important}
.mcard{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:13px 15px; margin-bottom:11px}
.mcard .mhead{display:flex; align-items:flex-start; gap:9px}
.mcard .chk{flex:none; margin-top:5px; width:19px; height:19px; accent-color:var(--red)}
.mcard.done .mname{color:var(--muted); text-decoration:line-through}
.mcard .mno{
  flex:none; width:24px; height:24px; border-radius:8px; background:var(--red); color:#fff;
  font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px;
}
.mcard .mname{font-size:15.5px; font-weight:600; line-height:1.45; flex:1}
.mcard .chips{margin:8px 0 2px 33px}
.mcard .fill{margin:7px 0 0 33px; font-size:14px}
.mcard .fill li{margin-bottom:3px}
.mcard .fill ul{margin:4px 0 0; padding-left:17px}
.mcard .fill .plain{white-space:pre-wrap}
.mcard .fill li.warnline{background:var(--amber-bg); color:var(--amber); border-radius:6px; padding:2px 7px; font-weight:600}
.mcard .sealbox{
  margin:9px 0 0 33px; background:var(--red-bg); border:1px solid #f0cfd1; border-radius:9px;
  padding:8px 10px; font-size:13.5px; color:var(--red-d);
}
.mcard .sealbox b{font-weight:600}
.mcard .annbox{
  margin:9px 0 0 33px; background:#fffbe9; border:1px dashed #e3c96b; border-radius:9px;
  padding:8px 10px; font-size:12.5px; color:#6b5310;
}
.mcard details{margin:8px 0 0 33px; font-size:13px; color:#4a525c}
.mcard details summary{cursor:pointer; color:var(--muted); font-size:12.5px; outline:none}
.mcard details .dbody{margin-top:6px; line-height:1.6; white-space:pre-wrap}
.mcard details .dbody b{color:var(--ink)}
.mcard.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%{background:#fff3c2; box-shadow:0 0 0 3px #ffd54d} 100%{background:var(--card)}}
.group{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:6px 10px 10px; margin-bottom:12px}
.ghead{display:flex; align-items:center; gap:9px; padding:9px 6px 7px}
.ghead .gicon{
  flex:none; width:34px; height:34px; border-radius:10px; font-size:18px;
  display:flex; align-items:center; justify-content:center; color:#fff;
}
.ghead .gt{flex:1; min-width:0}
.ghead .gname{font-size:15px; font-weight:700}
.ghead .gdesc{font-size:11.5px; color:var(--muted); line-height:1.4}
.ghead .gn{flex:none; font-size:11px; color:var(--muted)}
.scard{
  display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:11px;
  border:1px solid var(--line); background:#fbfcfd; margin-bottom:8px; cursor:pointer;
}
.scard:active{background:#f6f7f9}
.scard:last-child{margin-bottom:2px}
.scard .sicon{
  flex:none; width:36px; height:36px; border-radius:10px; font-size:19px;
  display:flex; align-items:center; justify-content:center; color:#fff;
}
.scard .st{flex:1; min-width:0}
.scard .st b{font-size:15px; display:block; line-height:1.4}
.scard .st small{color:var(--muted); font-size:12px; display:block; margin-top:1px; line-height:1.5}
.scard .cnt{flex:none; text-align:right}
.scard .cnt .n{font-size:17px; font-weight:700; color:var(--red)}
.scard .cnt small{display:block; color:var(--muted); font-size:10.5px}
.scard .arrow{color:#c8cdd4; font-size:17px; flex:none}
.statsline{margin:2px 2px 10px; font-size:12px; color:var(--muted)}
.stagehead{margin:18px 2px 8px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.stagehead .clr{border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:11px; border-radius:10px; padding:1px 9px}
.btnrow{display:flex; flex-direction:column; gap:9px; margin-top:10px}
.optbtn{
  border:1px solid var(--line); background:var(--card); border-radius:11px; padding:12px 14px;
  font-size:15px; text-align:left; color:var(--ink); cursor:pointer; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:8px;
}
.optbtn:active{background:var(--red-bg); border-color:#f0cfd1}
.optbtn .go{margin-left:auto; color:#c8cdd4}
.optbtn.sub{margin-left:18px; font-size:14.5px; padding:10px 12px}
.qlead{font-size:14.5px; font-weight:600; margin:14px 0 2px; color:var(--red-d)}
.resetlink{display:inline-block; margin-top:10px; font-size:13px; color:var(--muted); text-decoration:underline}
.actbtn{
  display:inline-block; border:none; background:var(--red); color:#fff; font-size:13px; font-weight:600;
  border-radius:10px; padding:8px 14px; margin:2px 6px 2px 0;
}
.actbtn.ghost{background:#fff; color:var(--red); border:1px solid #e5b9bb}
.pending-block{background:#fff8f8; border:1px solid #f2c7c9; border-radius:10px; padding:9px 12px; margin-top:8px; font-size:13px; color:var(--red-d)}
.pending-block li{margin-bottom:3px}
.pending-block ul{margin:4px 0 0; padding-left:17px}
.relrow{margin-top:6px}
.relchip{
  display:inline-block; border:1px solid var(--line); background:#f7f8fa; color:#4a525c;
  font-size:12.5px; border-radius:14px; padding:4px 12px; margin:3px 6px 3px 0; cursor:pointer;
}
table.kt{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:6px}
table.kt th{background:#f7f8fa; color:#4a525c; font-weight:600; text-align:left; padding:7px 9px; border:1px solid var(--line)}
table.kt td{padding:7px 9px; border:1px solid var(--line); vertical-align:top; line-height:1.55}
.cntfix{display:block; color:var(--red); font-weight:700; font-size:12px}
details.faq{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fbfcfd}
details.faq summary{padding:11px 13px; font-size:14.5px; font-weight:600; cursor:pointer; list-style:none; outline:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary:after{content:"+"; float:right; color:var(--muted); font-weight:400}
details.faq[open] summary:after{content:"−"}
details.faq .a{padding:0 13px 11px; font-size:13.5px; color:#4a525c; line-height:1.65}
details.auditblock{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:#fbfcfd}
details.auditblock summary{padding:10px 13px; font-size:13.5px; font-weight:600; cursor:pointer; outline:none; color:#4a525c}
details.auditblock .a{padding:0 13px 11px; font-size:13px; color:#4a525c; line-height:1.7}
details.auditblock .a b{color:var(--ink)}
.klist{margin:6px 0 0; padding-left:18px; font-size:13.5px}
.klist li{margin-bottom:4px}
.matrixwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:10px; border:1px solid var(--line); background:var(--card)}
table.matrix{border-collapse:collapse; font-size:12.5px; min-width:820px; width:100%}
table.matrix th{background:#f7f8fa; padding:8px 9px; border:1px solid var(--line); font-weight:600; text-align:center; white-space:nowrap}
table.matrix th.j{cursor:pointer; color:var(--blue)}
table.matrix td{padding:7px 9px; border:1px solid var(--line); text-align:center; vertical-align:middle}
table.matrix td.mname{text-align:left; font-weight:600; white-space:nowrap; position:sticky; left:0; background:var(--card); min-width:170px}
table.matrix td.left{text-align:left; white-space:nowrap}
table.matrix td .j{cursor:pointer}
td.mk-ok{color:var(--red); font-weight:700}
td.mk-opt{color:var(--amber); font-weight:600}
td.mk-no{color:#c8cdd4}
.diagram{margin:10px 0 2px; font-size:12.5px}
.diagram .drow{display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.diagram .dbox{
  border:1.5px solid var(--red); color:var(--red-d); background:var(--red-bg);
  border-radius:9px; padding:6px 10px; font-weight:600; text-align:center; line-height:1.4;
}
.diagram .dbox.soft{border-color:#c9d9f7; background:var(--blue-bg); color:var(--blue)}
.diagram .dbox.bank{border-color:var(--red); background:var(--red); color:#fff}
.diagram .darrow{text-align:center; color:var(--muted); padding:2px 0; letter-spacing:2px}
.foot{margin:20px 2px 8px; font-size:11.5px; color:var(--muted); line-height:1.8; text-align:center}
.foot .warn{color:var(--amber)}
.badge-inner{
  display:inline-block; font-size:11px; border:1px solid #e0b4b6; color:var(--red-d); background:var(--red-bg);
  border-radius:4px; padding:0 6px; margin-left:8px; vertical-align:1px;
}
.subtitle{color:var(--muted); font-size:13.5px; margin-top:-2px}
h1.page{font-size:19px; margin:2px 0 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.empty{padding:30px 10px; text-align:center; color:var(--muted); font-size:14px}
#overlay{
  position:fixed; inset:0; z-index:100; background:rgba(20,25,30,.55);
  display:none; align-items:flex-end; justify-content:center;
}
#overlay.show{display:flex}
#overlay .sheet{background:var(--card); border-radius:16px 16px 0 0; width:100%; max-width:760px; padding:14px 16px 20px; max-height:82vh; display:flex; flex-direction:column}
#overlay .ot{font-size:15px; font-weight:700; margin-bottom:6px; display:flex; align-items:center}
#overlay .ox{margin-left:auto; border:none; background:#f0f2f5; border-radius:14px; width:28px; height:28px; color:var(--muted); font-size:14px}
#overlay textarea{
  flex:1; min-height:220px; border:1px solid var(--line); border-radius:10px; padding:10px;
  font-size:13px; line-height:1.6; color:var(--ink); background:#fbfcfd; resize:none; width:100%;
}
#overlay .ohint{font-size:12px; color:var(--muted); margin-top:8px}
#toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:120;
  background:rgba(30,34,40,.92); color:#fff; font-size:13.5px; border-radius:18px; padding:8px 18px;
  display:none;
}
@media print{
  #topbar,#searchwrap,#bottomnav,#overlay,#toast{display:none !important}
  body{background:#fff}
  body.bigfont #main{zoom:1}
  #main{padding:0; max-width:none}
  .card,.mcard,.group{box-shadow:none; border:1px solid #ddd; break-inside:avoid}
  details{display:block}
  details > *{display:block !important}
  .scard,.sitem{display:none}
}
</style>
</head>
<body>
<header id="topbar">
  <button id="backbtn" aria-label="返回">‹</button>
  <div id="pagetitle">银企直联材料清单</div>
  <button class="tbtn alt" id="fontbtn" title="大字模式">A+</button>
  <button class="tbtn" id="viewbtn" title="切换行内/客户视图">客户版</button>
</header>
<div id="searchwrap">
  <div id="searchbox">
    <span class="icon">🔍</span>
    <input id="searchinput" type="search" placeholder="搜索材料名 / 填写要点 / 盖章 / 术语…" autocomplete="off">
  </div>
  <div id="searchdrop"></div>
</div>
<main id="main">
  <div class="card" id="boothint" style="text-align:center; padding:26px 16px">
    <div style="font-size:15px; font-weight:600; margin-bottom:8px">正在加载清单…</div>
    <div style="font-size:13px; color:var(--muted); line-height:1.8">如果长时间停留在本页，说明当前的查看器<b style="color:var(--red)">没有启用 JavaScript</b>。<br>
    请改用手机自带的<b style="color:var(--red)">「浏览器」或 Chrome</b> 打开本文件：<br>
    在微信中可点右上角「···」→ 选择「用浏览器打开 / 其他应用打开」。</div>
  </div>
  <noscript>
    <div class="card" style="text-align:center; padding:20px 16px">
      <div style="font-size:15px; font-weight:600; color:var(--red)">当前查看器禁用了脚本，无法显示清单</div>
      <div style="font-size:13px; color:var(--muted); margin-top:8px; line-height:1.8">请复制本文件后，用手机「浏览器」或 Chrome 打开。<br>（"HTML查看器"类应用通常不带脚本功能）</div>
    </div>
  </noscript>
</main>
<nav id="bottomnav">
  <button data-nav="#/home" data-key="home"><span class="ni">🏠</span>首页</button>
  <button data-nav="#/scenes" data-key="scenes"><span class="ni">📋</span>业务场景</button>
  <button data-nav="#/matrix" data-key="matrix"><span class="ni">📊</span>材料总览</button>
  <button data-nav="#/knowledge" data-key="knowledge"><span class="ni">📚</span>知识库</button>
</nav>
<div id="overlay"><div class="sheet">
  <div class="ot"><span id="otitle">客户版清单</span><button class="ox" id="oclose">✕</button></div>
  <textarea id="otext" readonly></textarea>
  <div class="ohint" id="ohint">全选复制后，可直接粘贴到微信发给客户（已隐藏行内话术与内部信息）。</div>

<script>
(function(){
"use strict";
function fatal(msg){
  var m = document.getElementById("main");
  if(!m) return;
  m.innerHTML = '<div class="card" style="text-align:center; padding:24px 16px">' +
    '<div style="font-size:15px; font-weight:600; color:var(--red); margin-bottom:8px">页面加载出错</div>' +
    '<div style="font-size:13px; color:var(--muted); line-height:1.9">' + msg +
    '<br><br>请改用手机自带的「浏览器」或 Chrome 打开本文件；<br>若仍出错，请把本页截图发给整理者。</div></div>';
}
try {

var D = JSON.parse(document.getElementById("app-data").textContent);
var LS_OK = false;
try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); LS_OK = true; } catch(e) {}
function lsGet(k){ if(!LS_OK) return null; try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ if(!LS_OK) return; try{ localStorage.setItem(k,v); }catch(e){} }

/* ---------------- 视图状态 ---------------- */
var isClient = lsGet("ylz_view") === "client";
var bigFont = lsGet("ylz_bigfont") === "1";

/* ---------------- 工具 ---------------- */
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
}
function el(id){ return document.getElementById(id); }
var CAT_LABEL = {"premise":"⚠️ 前提条件","mutex":"🔀 互斥关系","timing":"⏱ 生效与办理时间","script":"💬 行内话术","general":"📌 补充说明"};
var CAT_CLASS = {"premise":"premise","mutex":"mutex","timing":"timing","script":"script","general":"general"};
var CAT_CLIENT = {"premise":"⚠️ 办理前请注意","mutex":"🔀 请务必知悉","timing":"⏱ 生效与办理时间"};

function sceneById(id){
  for(var i=0;i<D.scenes.length;i++){ if(D.scenes[i].id===id) return D.scenes[i]; }
  return null;
}
function specialById(id){
  for(var i=0;i<D.specials.length;i++){ if(D.specials[i].id===id) return D.specials[i]; }
  return null;
}
function hintTag(){ return '<span class="hint-tag">使用提示</span>'; }
function auditTag(){ return '<span class="hint-tag" style="background:#5a3a7a;color:#ead9ff">审查标注</span>'; }

var sceneGroup = {};
(function(){
  for(var g=0; g<D.groups.length; g++){
    var grp = D.groups[g];
    for(var s=0; s<grp.scenes.length; s++) sceneGroup[grp.scenes[s]] = grp;
  }
})();
function groupOf(id){ return sceneGroup[id] || null; }
function relatedOf(id){
  var grp = groupOf(id);
  if(!grp) return [];
  var out = [];
  for(var i=0;i<grp.scenes.length;i++){
    var sid = grp.scenes[i];
    if(sid===id) continue;
    if(sceneById(sid)) out.push({id:sid, name:sceneById(sid).name, icon:D.icons[sid]||"📄", target:"scene"});
    else if(specialById(sid)) out.push({id:sid, name:specialById(sid).name, icon:D.icons[sid]||"⚡", target:"special"});
  }
  return out;
}

/* 填写要点：按原表 ①②③… 拆行展示（原表没有的不补）；⚠️ 行高亮 */
function fillHtml(text){
  if(!text) return "";
  var parts = String(text).split(/(?=[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮])/);
  var lines = [];
  for(var i=0;i<parts.length;i++){
    var p = parts[i].replace(/\s+$/,"");
    if(p) lines.push(p);
  }
  function lineCls(s){ return s.indexOf("⚠️")>=0 ? ' class="warnline"' : ""; }
  if(lines.length<=1) return '<div class="plain">'+esc(lines[0]||"")+"</div>";
  var out = "<ul>";
  for(var j=0;j<lines.length;j++){ out += "<li"+lineCls(lines[j])+">"+esc(lines[j])+"</li>"; }
  return out+"</ul>";
}

function chkKey(scId, idx){ return "ylz_chk:"+scId+":"+idx; }
function chkGet(scId, idx){ return lsGet(chkKey(scId, idx)) === "1"; }

/* ---------------- 组件 ---------------- */
function cautionBlocks(sc){
  var keys = ["premise","mutex","timing","script","general"];
  var html = "";
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    if(k==="script" && isClient) continue;
    var arr = sc.cautions && sc.cautions[k];
    if(!arr || !arr.length) continue;
    var label = (isClient && CAT_CLIENT[k]) ? CAT_CLIENT[k] : CAT_LABEL[k];
    html += '<div class="callout '+CAT_CLASS[k]+(k==="script"?" internal":"")+'"><div class="ct">'+label+"</div>";
    for(var j=0;j<arr.length;j++){
      html += esc(arr[j].text);

function pendingBlock(sc){

  for(var i=0;i<sc.pending.length;i++) html += "<li>"+esc(sc.pending[i])+"</li>";
  html += "</ul></div>";
  return html;
}

function tlLine(){
  var K = D.knowledge, out = "";
  for(var s=0;s<K.sections.length;s++){
    if(K.sections[s].title.indexOf("五")!==0) continue;
    var rows = K.sections[s].rows;
    for(var r=0;r<rows.length;r++){
      if(rows[r].cells.length>=2 && rows[r].cells[0].indexOf("整个流程需要多久")>=0){
        out = rows[r].cells.slice(1).join(" ");
      }
    }
  }
  return out;
}

function renderDtree(){
  var dc = D.decision;

    html += '<div class="qlead">'+esc(dc.q1)+"</div>";
    html += '<div class="btnrow">';

    html += '<button class="optbtn" data-d="yes">是，已开通<span class="go">›</span></button>';
    html += "</div>";
  } else if(dstate.step==="no"){
    html += '<div class="qlead">'+esc(dc.q1)+"</div>";
    html += '<div style="font-size:13px;color:var(--muted);margin:2px 0 0 2px">└ 否，尚未开通</div>';
    html += '<div class="qlead">'+esc(dc.q1_no_lead)+"</div>";
    html += '<div class="btnrow">';
    for(var i=0;i<dc.q1_no_options.length;i++){
      var o = dc.q1_no_options[i];
      html += '<button class="optbtn" data-target="'+o.target+'">'+esc(o.label)+'<span class="go">›</span></button>';
    }
    html += "</div>";
    html += '<span class="resetlink" data-d="reset">← 重新选择</span>';
  } else {
    html += '<div class="qlead">'+esc(dc.q1)+"</div>";
    html += '<div style="font-size:13px;color:var(--muted);margin:2px 0 0 2px">└ 是，已开通</div>';
    html += '<div class="qlead">'+esc(dc.q1_yes_lead)+"</div>";
    html += '<div class="btnrow">';
    for(var j=0;j<dc.q1_yes_options.length;j++){
      var op = dc.q1_yes_options[j];
      if(op.submenu){
        html += '<button class="optbtn" data-sub="'+j+'">'+esc(op.label)+'<span class="go">'+(dstate.sub===j?"−":"+")+"</span></button>";
        if(dstate.sub===j){
          for(var k=0;k<op.submenu.length;k++){
            var so = op.submenu[k];
            html += '<button class="optbtn sub" data-target="'+so.target+'">└ '+esc(so.label)+"<span class=\"go\">›</span></button>";
          }
        }
      } else {
        html += '<button class="optbtn" data-target="'+op.target+'">'+esc(op.label)+"<span class=\"go\">›</span></button>";
      }
    }
    html += "</div>";
    html += '<span class="resetlink" data-d="reset">← 重新选择</span>';
  }
  el("dtree").innerHTML = html;
}
function bindDtree(root){
  var btns = root.querySelectorAll("[data-d],[data-target],[data-sub]");
  for(var i=0;i<btns.length;i++){
    (function(b){
      b.addEventListener("click", function(ev){
        ev.stopPropagation();
        if(b.getAttribute("data-target")){
          var t = b.getAttribute("data-target");
          location.hash = (t.indexOf("special")===0 ? "#/special/" : "#/scene/") + t;
          return;
        }
        if(b.hasAttribute("data-sub")){ dstate.sub = (dstate.sub===parseInt(b.getAttribute("data-sub"),10)?-1:parseInt(b.getAttribute("data-sub"),10)); renderDtree(); bindDtree(el("dtree")); return; }
        var d = b.getAttribute("data-d");
        if(d==="no"){ dstate.step="no"; } else if(d==="yes"){ dstate.step="yes"; dstate.sub=-1; } else { dstate={step:"q1",sub:-1}; }
        renderDtree(); bindDtree(el("dtree"));
      });
    })(btns[i]);
  }
}

function viewMatrix(){

  if(M.headers.length){
    html += '<div class="matrixwrap"><table class="matrix"><thead><tr>';
    for(var i=0;i<M.headers.length;i++){
      var sc = ovColScene[M.headers[i]] ? ' class="j" data-nav="#/scene/'+ovColScene[M.headers[i]]+'"' : "";
      html += "<th"+sc+">"+esc(M.headers[i])+"</th>";
    }

    for(var r=0;r<M.rows.length;r++){
      var row = M.rows[r];
      html += "<tr>";
      html += '<td class="mname">'+esc(row.material_name)+"</td>";
      for(var c=0;c<M.headers.length-1;c++){
        var v = row.cells[c] || "";
        var cls = "mk-no";
        if(v.indexOf("✓")===0) cls = "mk-ok";
        else if(v.indexOf("可选")>=0) cls = "mk-opt";
        else if(v && v!=="-" && v!=="—") cls = "left";
        var jattr = "";
        if(cls==="mk-ok" && ovColScene[M.headers[c+1]]) jattr = ' data-nav="#/scene/'+ovColScene[M.headers[c+1]]+'" style="cursor:pointer"';
        html += "<td"+jattr+' class="'+cls+'">'+esc(v)+"</td>";
      }
      html += "</tr>";
    }
    html += "</tbody></table></div>";
  }
  /* 补充矩阵：原表未覆盖的 3 个场景，由场景明细自动生成（整理层） */
  var extraIds = [], inOv = {};
  for(var k in ovColScene) inOv[ovColScene[k]] = 1;
  for(var s=0;s<D.scenes.length;s++){ if(!inOv[D.scenes[s].id]) extraIds.push(D.scenes[s].id); }
  if(extraIds.length){
    var names = [], nameSeen = {};
    var matIdx = {};
    for(var e=0;e<extraIds.length;e++){
      var esc2 = sceneById(extraIds[e]);
      matIdx[esc2.id] = {};
      for(var m2=0;m2<esc2.materials.length;m2++){
        var nm = esc2.materials[m2].material_name;
        matIdx[esc2.id][nm] = m2;
        if(!nameSeen[nm]){ nameSeen[nm]=1; names.push(nm); }
      }
    }
    html += '<div class="stagehead" style="margin-top:14px">补充：原表未覆盖的 '+extraIds.length+' 个场景（由场景明细表自动生成'+(isClient?"":"，属整理层")+"）</div>";
    html += '<div class="matrixwrap"><table class="matrix"><thead><tr><th>材料名称</th>';

      var scx = sceneById(extraIds[x]);
      html += '<th class="j" data-nav="#/scene/'+scx.id+'">'+esc(scx.name)+"</th>";
    }
    html += "</tr></thead><tbody>";
    for(var n2=0;n2<names.length;n2++){
      html += "<tr><td class=\"mname\">"+esc(names[n2])+"</td>";
      for(var y=0;y<extraIds.length;y++){
        var idy = extraIds[y];
        if(matIdx[idy].hasOwnProperty(names[n2])){
          html += '<td class="mk-ok j" data-nav="#/scene/'+idy+"?m="+matIdx[idy][names[n2]]+'" style="cursor:pointer">✓</td>';
        } else {
          html += '<td class="mk-no">-</td>';
        }
      }
      html += "</tr>";
    }
    html += "</tbody></table></div>";
  }
  html += "</div>";
  if(D.toc.notes && D.toc.notes.length){
    html += '<div class="card"><h2><span class="bar"></span>目录表备注</h2>';
    for(var n3=0;n3<D.toc.notes.length;n3++){
      html += '<div style="font-size:13.5px; margin-top:5px">'+esc(D.toc.notes[n3].text)+"</div>";
    }
    html += "</div>";
  }
  html += footHtml();
  return html;
}

/* 知识库·决策表数量动态修正（P0-1） */
var KB_NAMES = [["新增银企直联盾","add_ukey"],["变更现金管理操作员","change_operator"],["注销成员或账号","remove_member"],["新增成员或账号或功能","add_member"],["开通电子票据功能","e_bill"],["开通对账功能","recon"],["新建银企直联","new_bank"],["注销集群","remove_cluster"],["重置密码","reset_pwd"]];
function kbCountFix(cells){
  var text = cells.join(" ");
  for(var i=0;i<KB_NAMES.length;i++){
    if(text.indexOf(KB_NAMES[i][0])>=0){
      var sc = sceneById(KB_NAMES[i][1]);
      if(!sc) return cells;
      var mch = text.match(/(\d+)\s*项/);
      if(mch && mch[1] !== String(sc.materials.length)){
        cells = cells.slice();
        cells[cells.length-1] = cells[cells.length-1] + "||CNTFIX||" + sc.materials.length;
      }
      return cells;
    }
  }
  return cells;
}

function renderSection(sec){
  var rows = sec.rows;
  var html = "";
  var isSec1 = sec.title.indexOf("一")===0;
  if(sec.title.indexOf("五")===0){
    var start = (rows.length && rows[0].cells.length>=2 && rows[0].cells[0]==="问题") ? 1 : 0;
    for(var i=start;i<rows.length;i++){
      var rr = rows[i];
      if(rr.cells.length>=2){
        html += '<details class="faq"><summary>'+esc(rr.cells[0])+"</summary><div class=\"a\">"+esc(rr.cells.slice(1).join("　"))+"</div></details>";
      } else {
        html += '<div class="klist"><li>'+esc(rr.cells[0]||"")+"</li></div>";
      }
    }
    return html;
  }
  var tableOpen = false;
  var headDone = false;
  for(var j=0;j<rows.length;j++){
    var r = rows[j];
    if(r.cells.length>=2){
      if(!tableOpen){ html += '<table class="kt">'; tableOpen = true; }
      var cells = isSec1 ? kbCountFix(r.cells.slice()) : r.cells;
      html += "<tr>";
      for(var c=0;c<cells.length;c++){
        var cellText = esc(cells[c]);
        var fix = "";
        if(isSec1 && cells[c].indexOf("||CNTFIX||")>=0){
          var pp = cells[c].split("||CNTFIX||");
          cellText = esc(pp[0]) + '<span class="cntfix">实际 '+pp[1]+" 项</span>";
        }
        if(!headDone){ html += "<th>"+cellText+"</th>"; }
        else { html += "<td>"+cellText+"</td>"; }
      }
      html += "</tr>";
      headDone = true;
    } else {
      if(tableOpen){ html += "</table>"; tableOpen=false; }
      html += '<div class="klist"><li>'+esc(r.cells[0]||"")+"</li></div>";
    }
  }
  if(tableOpen) html += "</table>";
  if(isSec1){
    html += '<div class="callout hint" style="margin-top:9px">'+hintTag()+"原表此表未收录：新增司库+银企直联、开通薪资代发功能、文件证书领取，请以「业务场景」页为准。数量列红色「实际X项」为本工具按场景明细表自动核对的结果。</div>";
  }
  return html;
}

function auditCardHTML(){
  if(isClient || !D.audit || !D.audit.contradictions) return "";
  var A = D.audit;
  var html = '<div class="card internal"><h2><span class="bar"></span>内容审查结论（'+A.date+'）</h2>';
  html += '<div class="subtitle">原文一律未改动；冲突处已在场景页挂「审查标注」。完整报告见 html工具/内容审查报告.md。</div>';
  html += '<details class="auditblock"><summary>矛盾清单（'+A.contradictions.length+' 条）</summary><div class="a">';
  for(var i=0;i<A.contradictions.length;i++){
    var c = A.contradictions[i];
    html += "<div style='margin-bottom:8px'><b>"+esc(c.id)+" "+esc(c.loc)+"</b><br>矛盾点："+esc(c.issue)+"<br><span style='color:var(--green)'>建议："+esc(c.sug)+"</span><br><span style='color:var(--muted)'>落地："+esc(c.impl)+"</span></div>";
  }
  html += "</div></details>";
  html += '<details class="auditblock"><summary>场景合并建议（'+A.merges.length+' 组）</summary><div class="a">';
  for(var j=0;j<A.merges.length;j++){
    var mm = A.merges[j];
    html += "<div style='margin-bottom:8px'><b>"+esc(mm.id)+" "+esc(mm.scenes)+"（"+esc(mm.level)+"）</b><br>理由："+esc(mm.reason)+"<br><span style='color:var(--green)'>统一描述："+esc(mm.unified)+"</span><br><span style='color:var(--muted)'>本轮落地："+esc(mm.impl)+"</span></div>";
  }
  html += "</div></details>";
  html += '<details class="auditblock"><summary>歧义待明确（'+A.ambiguous.length+' 条，原样保留）</summary><div class="a">';
  for(var k=0;k<A.ambiguous.length;k++){
    var q = A.ambiguous[k];
    html += "<div style='margin-bottom:8px'><b>"+esc(q.id)+" "+esc(q.loc)+"</b><br>"+esc(q.issue)+"<br><span style='color:var(--muted)'>处理："+esc(q.handle)+"</span></div>";
  }
  html += "</div></details></div>";
  return html;
}

function confirmsCardHTML(){
  if(isClient || !D.validation_confirms || !D.validation_confirms.length) return "";
  var html = '<div class="card internal"><h2><span class="bar"></span>数据校验状态</h2>';
  html += '<div class="subtitle">以下为自动校验发现的待确认差异（页面按场景明细表展示，原文未改动）：</div>';
  html += '<div class="klist">';
  for(var i=0;i<D.validation_confirms.length;i++) html += "<li>"+esc(D.validation_confirms[i])+"</li>";
  html += "</div></div>";
  return html;
}

function viewKnowledge(){
  var K = D.knowledge;
  var html = "";
  if(K.intro_note){
    html += '<div class="callout premise"><div class="ct">📌 办理需提供（原表口径）</div>'+esc(K.intro_note)+"</div>";
  }
  html += '<div class="callout hint">'+hintTag()+'「使用提示」为本工具整理时补充的通俗解释，帮助理解概念；<b>材料要求、盖章、份数等一律以各场景清单（原表）为准</b>。</div>';
  html += auditCardHTML();
  html += confirmsCardHTML();
  for(var i=0;i<K.sections.length;i++){
    var sec = K.sections[i];
    html += '<div class="card"><h2><span class="bar"></span>'+esc(sec.title)+"</h2>";
    html += renderSection(sec);
    html += "</div>";
  }
  html += footHtml();
  return html;
}

/* ---------------- 搜索（P2-4：索引到填写/盖章/注意事项，大小写归一） ---------------- */
function normQ(s){ return String(s||"").toLowerCase().replace(/\s+/g,""); }
function buildIndex(){
  var idx = [];
  function add(t,s,g,h){ idx.push({t:String(t||""), s:String(s||""), g:g, h:h}); }
  for(var i=0;i<D.scenes.length;i++){
    var sc = D.scenes[i];
    add(sc.name, sc.subtitle, "业务场景", "#/scene/"+sc.id);
    for(var c in sc.cautions){
      var arr = sc.cautions[c];
      for(var cc=0;cc<arr.length;cc++) add(arr[cc].text, sc.name+" · 注意事项", "注意事项", "#/scene/"+sc.id);
    }
    for(var j=0;j<sc.materials.length;j++){
      var m = sc.materials[j];
      add(m.material_name, sc.name+" · 第"+m.no+"项材料", "材料", "#/scene/"+sc.id+"?m="+j);
      if(m.fill_points) add(m.fill_points, m.material_name+"（"+sc.name+"）", "填写要点", "#/scene/"+sc.id+"?m="+j);
      if(m.seal) add(m.seal, m.material_name+"（"+sc.name+"）", "盖章要点", "#/scene/"+sc.id+"?m="+j);
    }
  }
  for(var k=0;k<D.specials.length;k++){
    add(D.specials[k].name, D.specials[k].desc, "特殊事项", "#/special/"+D.specials[k].id);
  }
  var K = D.knowledge;
  for(var s=0;s<K.sections.length;s++){
    var sec = K.sections[s];
    for(var r=0;r<sec.rows.length;r++){
      var cells = sec.rows[r].cells;
      if(!cells.length) continue;
      add(cells[0], cells.slice(1).join(" ").slice(0,60), "知识库·"+sec.title.slice(0,8), "#/knowledge");
    }
  }
  for(var z=0;z<idx.length;z++){ idx[z].tl = normQ(idx[z].t); idx[z].sl = normQ(idx[z].s); }
  return idx;
}
var SEARCH_IDX = buildIndex();
var QWORDS = ["盖章","份数","异地","多久","收费","协议编号"];
var searchTimer = null;
function doSearch(q){
  var drop = el("searchdrop");
  var nq = normQ(q);
  if(!nq){ drop.className=""; drop.innerHTML=""; return; }
  var hits = [];
  for(var i=0;i<SEARCH_IDX.length && hits.length<40;i++){
    if(SEARCH_IDX[i].tl.indexOf(nq)>=0 || SEARCH_IDX[i].sl.indexOf(nq)>=0) hits.push(SEARCH_IDX[i]);
  }
  var html = "";
  if(!hits.length){ html = '<div class="sempty">未找到与「'+esc(q)+'」相关的内容</div>'; }
  else{
    var lastG = "";
    for(var j=0;j<hits.length;j++){
      if(hits[j].g!==lastG){ html += '<div class="sgroup">'+esc(hits[j].g)+"</div>"; lastG = hits[j].g; }
      html += '<div class="sitem" data-nav="'+hits[j].h+'"><div>'+esc(hits[j].t)+"</div>"+(hits[j].s?"<small>"+esc(hits[j].s)+"</small>":"")+"</div>";
    }
  }
  drop.innerHTML = html;
  drop.className = "show";
}
function showQWords(){
  var drop = el("searchdrop");
  var html = '<div class="sgroup">常见检索</div><div id="qwords">';
  for(var i=0;i<QWORDS.length;i++) html += '<button data-q="'+QWORDS[i]+'">'+QWORDS[i]+"</button>";
  html += "</div>";
  drop.innerHTML = html;
  drop.className = "show";
}
function toast(msg){
  var t = el("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(function(){ t.style.display = "none"; }, 1800);
}

/* ---------------- 客户版导出（P2-1） ---------------- */
function buildClientText(sc){
  var L = [];
  L.push("【银企直联 · "+sc.name+"】材料清单（共 "+sc.materials.length+" 项）");
  if(sc.subtitle) L.push("适用："+sc.subtitle);
  L.push("时限："+(tlLine()||"收到资料后3-5个工作日"));
  var keys = ["premise","mutex","timing"];
  var labs = {premise:"办理前请注意", mutex:"请务必知悉", timing:"生效与办理"};
  for(var i=0;i<keys.length;i++){
    var arr = sc.cautions[keys[i]];
    if(arr && arr.length){
      var ts = [];
      for(var j=0;j<arr.length;j++) ts.push(arr[j].text);
      L.push(labs[keys[i]]+"："+ts.join(" "));
    }
  }
  if(sc.crossbranch && sc.crossbranch.length){
    for(var c=0;c<sc.crossbranch.length;c++){
      /* C1/C2 审查结论落地：客户版交付物中将错误的"第1项/第3项"序号指代改为表名指代；页面原文不动 */
      var cbText = String(sc.crossbranch[c].text)
        .replace(/第1项集群信息表和第3项成员单位授权书/g, "《现金管理集群信息表》和《现金管理成员单位授权书》");
      L.push("异地提示："+cbText);
    }
  }
  L.push("");
  for(var k=0;k<sc.materials.length;k++){
    var m = sc.materials[k];
    L.push((k+1)+". "+m.material_name);
    var bits = [];
    if(m.quantity) bits.push("份数："+m.quantity);
    if(m.printing && m.printing!=="/") bits.push("打印："+m.printing);
    if(bits.length) L.push("　　"+bits.join("；"));
    if(m.fill_points) L.push("　　填写："+m.fill_points);
    if(m.seal) L.push("　　盖章："+m.seal);
    else if(m.seal_owner) L.push("　　盖章："+m.seal_owner);
  }
  L.push("");
  L.push("※ 本清单为整理版，仅供参考，办理口径以银行最新要求为准；如有疑问请联系客户经理。");
  return L.join("\n");
}
function openExport(title, text){
  el("otitle").textContent = title;
  el("otext").value = text;
  el("overlay").className = "show";
  setTimeout(function(){ el("otext").select(); }, 60);
}

/* ---------------- 勾选核对（P2-2） ---------------- */
function updateChkProg(sc){
  var sp = el("chkprog");
  if(!sp) return;
  var n = 0;
  for(var i=0;i<sc.materials.length;i++){ if(chkGet(sc.id, i)) n++; }
  sp.textContent = "收单核对 "+n+"/"+sc.materials.length;
}

/* ---------------- 路由（P2-3：状态记忆 / P2-7：返回栈+滚动记忆） ---------------- */
var MAIN = el("main");
var navStack = [location.hash || "#/home"];
var goingBack = false;
var scrollMem = {};
var prevHash = location.hash || "#/home";

function applyViewClass(){
  document.body.className = (isClient ? "clientview" : "") + (bigFont ? " bigfont" : "");
  el("viewbtn").textContent = isClient ? "行内版" : "客户版";
  el("fontbtn").textContent = bigFont ? "A-" : "A+";
}

function route(){
  var h = location.hash || "#/home";
  scrollMem[prevHash] = window.pageYOffset || document.documentElement.scrollTop || 0;
  if(goingBack){
    if(navStack.length>1) navStack.pop();
    goingBack = false;
  } else if(h !== navStack[navStack.length-1]){
    navStack.push(h);
    if(navStack.length>40) navStack.shift();
  }
  prevHash = h;
  lsSet("ylz_last", h);

  var parts = h.slice(2).split("?");
  var segs = parts[0].split("/");
  var key = segs[0] || "home";
  var arg = segs[1] || "";
  var q = parts[1] || "";
  var title = "银企直联材料清单";
  var showBack = navStack.length>1;
  var html = "";
  closeSearch();

  if(key==="scene" && arg){
    var sc = sceneById(arg);
    if(sc){ html = sceneBody(sc); title = sc.name; showBack = true; }
    else html = '<div class="empty">场景不存在</div>';
  } else if(key==="special" && arg){
    var sp = specialById(arg);
    if(sp){ html = specialBody(sp); title = sp.name; showBack = true; }
    else html = '<div class="empty">事项不存在</div>';
  } else if(key==="scenes"){
    html = viewScenes(); title = "业务场景";
  } else if(key==="matrix"){
    html = viewMatrix(); title = "材料总览";
  } else if(key==="knowledge"){
    html = viewKnowledge(); title = "知识库";
  } else {
    key = "home";
    html = viewHome();
  }

  MAIN.innerHTML = html;
  var targetY = scrollMem.hasOwnProperty(h) ? scrollMem[h] : 0;
  window.scrollTo(0, targetY>0?targetY:1);
  el("pagetitle").textContent = title;
  el("backbtn").className = showBack ? "show" : "";
  var navs = document.querySelectorAll("#bottomnav button");
  for(var i=0;i<navs.length;i++){
    navs[i].className = (navs[i].getAttribute("data-key")===key) ? "on" : "";
  }
  if(key==="home"){
    renderDtree(); bindDtree(MAIN);
  }
  if(key==="scene" && arg){
    var scn = sceneById(arg);
    if(scn){
      bindScenePage(scn);
      var mm = q.match(/m=(\d+)/);
      if(mm){
        var card = MAIN.querySelector('.mcard[data-m="'+mm[1]+'"]');
        if(card){
          setTimeout(function(){
            card.scrollIntoView({behavior:"smooth", block:"center"});
            card.className = card.className + " flash";
            setTimeout(function(){ card.className = card.className.replace(" flash",""); }, 2400);
          }, 150);
        }
      }
    }
  }
}

function bindScenePage(sc){
  var boxes = MAIN.querySelectorAll(".chk");
  for(var i=0;i<boxes.length;i++){
    (function(bx){
      bx.addEventListener("change", function(){
        var idx = bx.getAttribute("data-chk");
        lsSet(chkKey(sc.id, idx), bx.checked ? "1" : "0");
        var card = bx.closest ? bx.closest(".mcard") : null;
        if(card){
          if(bx.checked){ card.className += " done"; }
          else { card.className = card.className.replace(" done",""); }
          var noEl = card.querySelector(".mno");
          if(noEl) noEl.textContent = bx.checked ? "✓" : (parseInt(idx,10)+1);
        }
        updateChkProg(sc);
      });
    })(boxes[i]);
  }
  var clr = el("chkclr");
  if(clr) clr.addEventListener("click", function(){
    for(var i=0;i<sc.materials.length;i++) lsSet(chkKey(sc.id, i), "0");
    route();
    toast("已清除本场景勾选");
  });
  var cp = el("copyclient");
  if(cp) cp.addEventListener("click", function(){
    openExport("客户版清单 · "+sc.name, buildClientText(sc));
  });
}

function closeSearch(){
  var drop = el("searchdrop");
  drop.className = "";
  el("searchinput").value = "";
}

/* ---------------- 事件 ---------------- */
document.addEventListener("click", function(ev){
  var t = ev.target;
  var nav = t.closest ? t.closest("[data-nav]") : null;
  if(nav){ location.hash = nav.getAttribute("data-nav"); return; }
  var qw = t.closest ? t.closest("[data-q]") : null;
  if(qw){ doSearch(qw.getAttribute("data-q")); return; }
  var drop = el("searchdrop");
  if(drop.className==="show" && !t.closest("#searchwrap")) closeSearch();
});
el("backbtn").addEventListener("click", function(){
  if(navStack.length>1){
    goingBack = true;
    var target = navStack[navStack.length-2];
    location.hash = target;
  } else {
    location.hash = "#/home";
  }
});
el("viewbtn").addEventListener("click", function(){
  isClient = !isClient;
  lsSet("ylz_view", isClient ? "client" : "internal");
  applyViewClass();
  route();
  toast(isClient ? "已切换到客户视图（隐藏行内信息）" : "已切换到行内视图");
});
el("fontbtn").addEventListener("click", function(){
  bigFont = !bigFont;
  lsSet("ylz_bigfont", bigFont ? "1" : "0");
  applyViewClass();
});
el("oclose").addEventListener("click", function(){ el("overlay").className = ""; });
el("overlay").addEventListener("click", function(ev){ if(ev.target===el("overlay")) el("overlay").className = ""; });
el("searchinput").addEventListener("input", function(){
  var self = this;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){ doSearch(self.value); }, 120);
});
el("searchinput").addEventListener("focus", function(){
  if(!this.value) showQWords();
});
window.addEventListener("hashchange", route);
window.addEventListener("beforeprint", function(){
  var ds = document.querySelectorAll("details");
  for(var i=0;i<ds.length;i++) ds[i].setAttribute("open","open");
});

applyViewClass();
var savedHash = lsGet("ylz_last");
if(!location.hash && savedHash) location.hash = savedHash;
route();

} catch(e) {
  fatal("错误信息：" + ((e && e.message) ? e.message : e));
}
})();
</script>
